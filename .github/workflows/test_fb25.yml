name: Erlang CI Fb25

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    name: Build and test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout sources
      uses: actions/checkout@v3
    - name: Setup FirebirdSQL container
      uses: juarezr/firebirdsql-github-action@v1.2.0
      with:
        version: '2.5-ss'
        isc_password: "masterkey"
    - name: Set up Erlang
      uses: erlef/setup-beam@v1
      with:
        otp-version: '26.0'
        rebar3-version: '3'
    - name: Run tests
      run: rebar3 eunit
    - name: Firebird container logs
      if: always()
      run: |
        docker ps -a
        for c in $(docker ps -aq); do
          echo "== docker logs $c"; docker logs "$c" 2>&1 | tail -60
          echo "== firebird.log $c"; docker exec "$c" sh -c 'cat /firebird/log/firebird.log 2>/dev/null || find / -name firebird.log -exec cat {} \; 2>/dev/null' || true
        done
